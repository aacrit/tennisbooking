name: Scan Tennis Courts

on:
  schedule:
    # Backup scan every 2 hours during active hours (CT = UTC-6 during CST)
    # Primary real-time detection runs on Fly.io; this is for the static dashboard.
    - cron: '0 12,14,16,18,20,22,0,2,4 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install playwright pydantic-settings python-dotenv pytz
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scan_to_json.py
        continue-on-error: true
        env:
          WEEKDAY_EARLIEST_HOUR: '18'
          DAYS_AHEAD: '6'
          SCRAPER_DEBUG: '1'
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics-${{ github.run_number }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/status.json docs/data/api_context.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$BRANCH" || true
            git commit -m "Update availability $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "$BRANCH"
          fi
