name: Scan Tennis Courts

on:
  schedule:
    # Every 45 minutes, 6 AM - midnight CT (12:00-05:59 UTC during CST/UTC-6)
    # No scanning midnight-6 AM CT. Adjust by -1 hour during CDT.
    - cron: '0,45 12-23,0-5 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install playwright pydantic-settings python-dotenv pytz
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scan_to_json.py
        continue-on-error: true
        env:
          WEEKDAY_EARLIEST_HOUR: '18'
          DAYS_AHEAD: '6'

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$BRANCH" || true
            git commit -m "Update availability $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "$BRANCH"
          fi
