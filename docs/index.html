<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <title>McFetridge Tennis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-inner">
                <div class="topbar-left">
                    <span class="app-name">McFetridge Tennis</span>
                </div>
                <div class="topbar-right">
                    <div class="live-status">
                        <span class="pulse-dot pulse-gray" id="status-dot"></span>
                        <span class="status-text" id="status-text">Loading...</span>
                    </div>
                    <button class="notif-btn" id="notif-btn" onclick="toggleNotifications()" title="Enable notifications">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 01-3.46 0"/>
                        </svg>
                    </button>
                    <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()" title="Refresh data">
                        <svg class="refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="topbar-spacer"></div>

        <!-- Slot Count Summary -->
        <div class="summary">
            <div class="summary-count" id="total-count">--</div>
            <div class="summary-label" id="summary-label">loading availability...</div>
        </div>

        <!-- 6-Day Calendar (3x2 grid) -->
        <div class="calendar-scroll">
            <div class="calendar-grid" id="calendar-grid">
                <!-- Skeleton placeholders -->
                <div class="day-card skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
                <div class="day-card skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
                <div class="day-card skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
                <div class="day-card skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
                <div class="day-card skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
                <div class="day-card skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
            </div>
        </div>

        <!-- Slot Changes -->
        <div id="changes-container"></div>

        <!-- Non-Tennis Court Availability (collapsible) -->
        <details class="other-availability" id="other-section">
            <summary class="other-heading">
                <span>Other McFetridge Activities</span>
                <span class="other-count" id="other-count">0</span>
                <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </summary>
            <div class="calendar-scroll">
                <div class="calendar-grid" id="other-calendar-grid">
                    <div class="empty-hero">
                        <div class="empty-icon">&#127935;</div>
                        <div class="empty-title">No non-tennis slots</div>
                        <div class="empty-body">No pickleball, ball machine, or other court availability found.</div>
                    </div>
                </div>
            </div>
        </details>

        <!-- Footer -->
        <div class="page-footer">
            <span>McFetridge Sports Center</span>
            <span class="footer-sep">&middot;</span>
            <span>3843 N California Ave, Chicago</span>
            <br>
            <span class="footer-refresh" id="refresh-countdown">Data updated every ~45 minutes</span>
        </div>

    </div>

    <script>
    (function() {
        var BOOKING_URL = 'https://anc.apm.activecommunities.com/chicagoparkdistrict/reservation/landing/quick?groupId=1&locale=en-US';
        var DAY_FULL = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday' };
        var REFRESH_INTERVAL = 5 * 60; // seconds
        var countdown = REFRESH_INTERVAL;
        var notificationsEnabled = localStorage.getItem('notif_enabled') === 'true';

        // ── Init ──
        loadStatus();
        setInterval(function() { loadStatus(); countdown = REFRESH_INTERVAL; }, REFRESH_INTERVAL * 1000);
        setInterval(tickCountdown, 1000);
        updateNotifButton();
        if (notificationsEnabled && 'serviceWorker' in navigator) {
            setupServiceWorker();
        }

        // ── Data Loading ──
        async function loadStatus() {
            try {
                var resp = await fetch('data/status.json?_=' + Date.now());
                if (!resp.ok) return;
                var data = await resp.json();
                renderCalendar(data.calendar || []);
                renderCount(data.total_slots || 0);
                renderStatus(data);
                renderChanges(data.changes || {});
                renderOtherCalendar(data.other_calendar || []);
                renderOtherCount(data.other_total_slots || 0);
                autoExpandOther(data.total_slots || 0, data.other_total_slots || 0);
                checkForegroundNotifications(data);
            } catch (e) {
                console.error('Failed to load status:', e);
            }
        }

        // ── Calendar Rendering ──
        function renderCalendar(calendar) {
            var grid = document.getElementById('calendar-grid');
            var totalSlots = 0;
            calendar.forEach(function(d) { totalSlots += (d.slots ? d.slots.length : 0); });

            if (!calendar.length) {
                grid.innerHTML = '<div class="empty-hero"><div class="empty-title">No data yet</div></div>';
                return;
            }

            // Load previous visit slots for "NEW" badges
            var prevVisitSlots = getPrevVisitSlots();

            grid.innerHTML = calendar.map(function(day, i) {
                var emptyClass = (!day.slots || day.slots.length === 0) ? ' day-empty' : '';
                var hasSlots = day.slots && day.slots.length > 0;

                var tag = '';
                if (i === 0) {
                    tag = '<span class="day-tag">Tomorrow</span>';
                }

                var countBadge = hasSlots ? '<span class="day-count">' + day.slots.length + '</span>' : '';

                var slotsHtml;
                if (hasSlots) {
                    slotsHtml = day.slots.map(function(s) {
                        var court = s.court_name ? '<span class="slot-court">' + esc(s.court_name) + '</span>' : '';
                        var slotKey = day.date + '|' + s.slot_time + '|' + (s.court_name || '');
                        var newBadge = (!prevVisitSlots.has(slotKey)) ? '<span class="slot-new">NEW</span>' : '';
                        return '<a class="slot-chip" href="' + BOOKING_URL + '" target="_blank" rel="noopener">' +
                            '<span class="slot-time">' + esc(s.slot_time) + '</span>' + court + newBadge +
                            '<svg class="slot-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' +
                        '</a>';
                    }).join('');
                } else {
                    slotsHtml = '<div class="no-slots">No availability</div>';
                }

                return '<div class="day-card' + emptyClass + '">' +
                    '<div class="day-header">' +
                        '<span class="day-name">' + esc(day.day_name) + '</span>' +
                        '<span class="day-date">' + esc(day.date_display) + '</span>' +
                        countBadge + tag +
                    '</div>' +
                    '<div class="day-slots">' + slotsHtml + '</div>' +
                '</div>';
            }).join('');

            // Save current slots as "previous visit" for next time
            savePrevVisitSlots(calendar);
        }

        // ── Count with animation ──
        function renderCount(total) {
            var el = document.getElementById('total-count');
            if (el.textContent !== '--' && el.textContent !== String(total)) {
                el.classList.add('updating');
                setTimeout(function() {
                    el.textContent = total;
                    el.classList.remove('updating');
                }, 150);
            } else {
                el.textContent = total;
            }
            document.getElementById('summary-label').textContent =
                'tennis ' + (total === 1 ? 'slot' : 'slots') + ' available in the next 6 days';
        }

        // ── Status ──
        function renderStatus(data) {
            var dot = document.getElementById('status-dot');
            var text = document.getElementById('status-text');
            if (data.last_scan_success === true) {
                dot.className = 'pulse-dot pulse-green';
                text.textContent = timeAgo(data.last_scan_time || '');
            } else if (data.last_scan_success === false) {
                dot.className = 'pulse-dot pulse-red';
                text.textContent = 'Scan failed';
            } else {
                dot.className = 'pulse-dot pulse-gray';
                text.textContent = 'No data yet';
            }
        }

        // ── Slot Changes ──
        function renderChanges(changes) {
            var container = document.getElementById('changes-container');
            if (!changes || (!changes.opened || !changes.opened.length) && (!changes.closed || !changes.closed.length)) {
                container.innerHTML = '';
                return;
            }

            var html = '<div class="changes-section">';
            html += '<div class="changes-header">Recent Changes</div>';

            if (changes.opened && changes.opened.length) {
                html += changes.opened.map(function(c) {
                    return '<div class="change-row change-opened">' +
                        '<span class="change-icon">+</span>' +
                        '<span class="change-detail">' + esc(c.time) + ' ' + esc(c.court_name) + '</span>' +
                        '<span class="change-date">' + esc(c.date) + '</span>' +
                    '</div>';
                }).join('');
            }

            if (changes.closed && changes.closed.length) {
                html += changes.closed.map(function(c) {
                    return '<div class="change-row change-closed">' +
                        '<span class="change-icon">&minus;</span>' +
                        '<span class="change-detail">' + esc(c.time) + ' ' + esc(c.court_name) + '</span>' +
                        '<span class="change-date">' + esc(c.date) + '</span>' +
                    '</div>';
                }).join('');
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // ── Other (Non-Tennis) Calendar ──
        function renderOtherCalendar(calendar) {
            var grid = document.getElementById('other-calendar-grid');
            if (!grid) return;
            var totalSlots = 0;
            calendar.forEach(function(d) { totalSlots += (d.slots ? d.slots.length : 0); });

            if (!calendar.length || totalSlots === 0) {
                grid.innerHTML =
                    '<div class="empty-hero">' +
                        '<div class="empty-icon">&#127935;</div>' +
                        '<div class="empty-title">No non-tennis slots</div>' +
                        '<div class="empty-body">No pickleball, ball machine, or other court availability found.</div>' +
                    '</div>';
                return;
            }

            grid.innerHTML = calendar.map(function(day, i) {
                var emptyClass = (!day.slots || day.slots.length === 0) ? ' day-empty' : '';
                var hasSlots = day.slots && day.slots.length > 0;

                var tag = '';
                if (i === 0) {
                    tag = '<span class="day-tag">Tomorrow</span>';
                }

                var countBadge = hasSlots ? '<span class="day-count other-badge">' + day.slots.length + '</span>' : '';

                var slotsHtml;
                if (hasSlots) {
                    slotsHtml = day.slots.map(function(s) {
                        var court = s.court_name ? '<span class="slot-court">' + esc(s.court_name) + '</span>' : '';
                        return '<div class="slot-chip other-slot-chip">' +
                            '<span class="slot-time">' + esc(s.slot_time) + '</span>' + court +
                        '</div>';
                    }).join('');
                } else {
                    slotsHtml = '<div class="no-slots">No availability</div>';
                }

                return '<div class="day-card other-day' + emptyClass + '">' +
                    '<div class="day-header">' +
                        '<span class="day-name">' + esc(day.day_name) + '</span>' +
                        '<span class="day-date">' + esc(day.date_display) + '</span>' +
                        countBadge + tag +
                    '</div>' +
                    '<div class="day-slots">' + slotsHtml + '</div>' +
                '</div>';
            }).join('');
        }

        function renderOtherCount(total) {
            var el = document.getElementById('other-count');
            if (el) el.textContent = total;
        }

        function autoExpandOther(tennisTotal, otherTotal) {
            var section = document.getElementById('other-section');
            if (!section) return;
            // Auto-expand when tennis has no slots but other activities do
            if (tennisTotal === 0 && otherTotal > 0) {
                section.open = true;
            }
        }

        // ── Countdown Timer ──
        function tickCountdown() {
            countdown--;
            if (countdown < 0) countdown = REFRESH_INTERVAL;
            var el = document.getElementById('refresh-countdown');
            if (el) {
                var m = Math.floor(countdown / 60);
                var s = countdown % 60;
                el.textContent = 'Next refresh in ' + m + 'm ' + (s < 10 ? '0' : '') + s + 's';
            }
        }

        // ── Notifications ──
        function checkForegroundNotifications(data) {
            if (!notificationsEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;

            var prevJSON = localStorage.getItem('notif_prev_slots');
            localStorage.setItem('notif_prev_slots', JSON.stringify(data));
            if (!prevJSON) return;

            var prev;
            try { prev = JSON.parse(prevJSON); } catch(e) { return; }

            var oldSlots = new Set();
            (prev.calendar || []).forEach(function(d) {
                (d.slots || []).forEach(function(s) {
                    oldSlots.add(d.date + '|' + s.slot_time + '|' + (s.court_name || ''));
                });
            });

            var newSlots = [];
            (data.calendar || []).forEach(function(d) {
                (d.slots || []).forEach(function(s) {
                    var key = d.date + '|' + s.slot_time + '|' + (s.court_name || '');
                    if (!oldSlots.has(key)) {
                        newSlots.push(d.day_name + ' ' + s.slot_time + (s.court_name ? ' ' + s.court_name : ''));
                    }
                });
            });

            if (newSlots.length > 0) {
                new Notification('New Tennis Court Available!', {
                    body: newSlots.join(', '),
                    tag: 'tennis-new-slot',
                });
            }
        }

        window.toggleNotifications = async function() {
            if (!('Notification' in window)) {
                alert('Notifications are not supported in this browser.');
                return;
            }

            if (Notification.permission === 'default') {
                var perm = await Notification.requestPermission();
                if (perm === 'granted') {
                    notificationsEnabled = true;
                    localStorage.setItem('notif_enabled', 'true');
                    await setupServiceWorker();
                    updateNotifButton();
                }
            } else if (Notification.permission === 'granted') {
                notificationsEnabled = !notificationsEnabled;
                localStorage.setItem('notif_enabled', notificationsEnabled ? 'true' : 'false');
                updateNotifButton();
            } else {
                alert('Notifications are blocked. Please enable them in your browser settings.');
            }
        };

        function updateNotifButton() {
            var btn = document.getElementById('notif-btn');
            if (notificationsEnabled && 'Notification' in window && Notification.permission === 'granted') {
                btn.classList.add('active');
                btn.title = 'Notifications enabled';
            } else {
                btn.classList.remove('active');
                btn.title = 'Enable notifications';
            }
        }

        async function setupServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            try {
                var reg = await navigator.serviceWorker.register('sw.js');
                if ('periodicSync' in reg) {
                    try {
                        var status = await navigator.permissions.query({ name: 'periodic-background-sync' });
                        if (status.state === 'granted') {
                            await reg.periodicSync.register('check-slots', {
                                minInterval: 15 * 60 * 1000,
                            });
                        }
                    } catch (e) {
                        // periodicSync not available
                    }
                }
            } catch (e) {
                console.warn('SW registration failed:', e);
            }
        }

        // ── "NEW" Badge Tracking ──
        function getPrevVisitSlots() {
            var raw = localStorage.getItem('prev_visit_slots');
            if (!raw) return new Set();
            try {
                return new Set(JSON.parse(raw));
            } catch(e) {
                return new Set();
            }
        }

        function savePrevVisitSlots(calendar) {
            var keys = [];
            calendar.forEach(function(d) {
                (d.slots || []).forEach(function(s) {
                    keys.push(d.date + '|' + s.slot_time + '|' + (s.court_name || ''));
                });
            });
            localStorage.setItem('prev_visit_slots', JSON.stringify(keys));
        }

        // ── Utilities ──
        function timeAgo(dateStr) {
            if (!dateStr) return '';
            var clean = dateStr.replace(/ CT$/, '').replace(/ CST$/, '').replace(/ CDT$/, '');
            var d = new Date(clean);
            if (isNaN(d.getTime())) return dateStr;
            var diff = Math.floor((Date.now() - d.getTime()) / 60000);
            if (diff < 0) return 'just now';
            if (diff < 1) return 'just now';
            if (diff < 60) return diff + 'm ago';
            if (diff < 1440) return Math.floor(diff / 60) + 'h ago';
            return Math.floor(diff / 1440) + 'd ago';
        }

        function esc(str) {
            var el = document.createElement('span');
            el.textContent = str || '';
            return el.innerHTML;
        }

        // ── Manual Refresh ──
        window.manualRefresh = async function() {
            var btn = document.getElementById('refresh-btn');
            var icon = btn.querySelector('.refresh-icon');
            btn.disabled = true;
            icon.style.animation = 'spin 0.6s linear infinite';
            await loadStatus();
            countdown = REFRESH_INTERVAL;
            setTimeout(function() {
                icon.style.animation = '';
                btn.disabled = false;
            }, 600);
        };
    })();
    </script>
</body>
</html>
